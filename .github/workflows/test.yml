name: Tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Each OS reports its own result: one red must not cancel the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The oldest Python the harness supports (decision 44).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: bash test/run
        shell: bash
      - run: bash test/ledger
        shell: bash
      # On Windows, Git Bash hands Python the C:/ form of the test's repo path, so the logs folder differs.
      - run: bash test/cockpit
        if: runner.os != 'Windows'
        shell: bash
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash sdd/bin/sdd audit --range "$BASE..$TIP"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}
